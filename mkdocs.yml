site_name: NHT
site_url: https://nutanix-japan.github.io/nhtd1_material
site_author: Lakshmi Balaramane

# Repository

repo_name: nutanix-japan/nhtd1_material
repo_url: https://github.com/nutanix-japan/nhtd1_material

# Copyright
copyright: Copyright &copy; 2016 - 2024 Nutanix Enablement Practice


# Configuration

theme:
  palette:
  #   - primary: deep purple
  #   - accent: black

  # Palette toggle for automatic mode
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode

  # Palette toggle for light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode

  # Palette toggle for dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    toggle:
      icon: material/brightness-4
      name: Switch to system preference

  name: material
  icon:
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
  features:
  - navigation.instant
  - navigation.instant.progress
  - navigation.path
  - navigation.footer
  - navigation.tracking
  # - navigation.sections
  - navigation.tabs
  - navigation.tabs.sticky
  # - navigation.expand
  - navigation.top
  - navigation.integrateåß
  - search.highlight
  - search.suggest
  - search.share
  - toc.follow
  - announce.dismiss
  - content.action.edit
  - content.action.view
  - content.code.annotate
  - content.code.copy
  - content.code.annotate
  - content.code.select

  palette:

    # Palette toggle for automatic mode
    # - media: "(prefers-color-scheme)"
    #   scheme: default
    #   toggle:
    #     icon: material/brightness-auto
    #     name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to system preference
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.tasklist:
    custom_checkbox: true
- attr_list
- md_in_html
- pymdownx.keys
#- markdown_grid_tables

plugins:
- termynal:
    prompt_literal_start:
    - "$"
    - ">"
    - ">>>"
- search

# # Style sheeting here
# extra_css:
#   - stylesheets/extra.css

# Site navigation

nav:
    - Infrastructure Setup:
      - Getting Started : index.md
      - Foundation: diyfoundation/diyfoundation.md
      - Prism Central Deployment: pcdeploy/pcdeploy.md
      - X-Ray: xray/xray.md
    - Workload Setup:
      - Admin components:
        - Getting Started: vm_app/index.md
        - Jumphost VM: infra/infra_jumphost_tofu.md
      - Three-layer App: 
        - Infrastructure VMs: vm_app/app_infra.md 
        - Database VM: vm_app/deploy_mysql.md
        - Front-end VMs: vm_app/vm_app.md
        - HA Proxy VM: vm_app/deploy_ha_proxy.md
        - Testing App: vm_app/test_app.md
